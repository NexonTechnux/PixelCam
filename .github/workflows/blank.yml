name: Build and Release APK

on:
  push:
  # Esegue la action ogni volta che crei un tag che inizia con "v" (es. v1.0.0)
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Se vuoi la versione firmata (Release), usa assembleRelease e configura il firmatore.
      # Per ora puntiamo all'APK di debug o release non firmata generata in output:
      # build/outputs/apk/debug/app-debug.apk oppure build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
